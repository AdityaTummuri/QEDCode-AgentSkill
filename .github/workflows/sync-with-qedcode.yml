name: sync-with-qedcode
# Keeps the skill aligned with QEDCode: every push, every pull request and once a week, install
# QEDCode from its main branch and check that every command, flag and JSON field the skill
# documents still exists and behaves as described. No model and no network beyond the installs.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Install QEDCode from main, and its bug zoo
        run: |
          uv tool install "git+https://github.com/AdityaTummuri/QEDCode"
          git clone --depth 1 https://github.com/AdityaTummuri/QEDCode ../QEDCode
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          qed --version
      - name: Skill package (frontmatter, links, every qed command and flag)
        run: python3 tests/validate_skill.py --qed qed
      - name: qed check / verify behave as the skill documents
        run: python3 tests/check_contract.py --zoo ../QEDCode/bugzoo --qed qed
      - name: Package builds
        run: scripts/package.sh
